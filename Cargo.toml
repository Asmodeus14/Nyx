[workspace]
members = [
    "nyx-kernel",
    
    # Tools
    "tools/compiler",
    "tools/runner",
    # Rasterizes the Meridian icon set out of the design document into a coverage table. Host-only,
    # run by hand — see the module docs for why it is not a build.rs.
    "tools/icons",
    
    # Libraries
    "libs/api",
    "libs/gui",
    # Meridian's foundation: tokens, the multi-size/multi-face glyph + icon atlas, shapes. A
    # workspace member specifically so `cargo test -p nyx-meridian` runs on the host. Atlas packing
    # and glyph metrics are exactly the kind of thing that looks fine and is subtly wrong, and this
    # machine has no QEMU — a bug found here costs seconds, the same bug found on hardware costs a
    # power cycle.
    "libs/meridian",
    # The Entity's creature: seed, genome, evolution, appearance. Independent of the shell and of
    # every driver, so it is exercised entirely on the host — and it has to be, because its output is
    # cross-checked cell for cell against the JavaScript generator in the design document. A creature
    # that renders differently on the machine than in the document is not a rendering bug; it means
    # the two implementations have silently forked and every Entity in existence has changed.
    "libs/entity",
    # SHA-1 / HMAC / PBKDF2, lifted out of `iwlwifi.rs` so the Meridian lock can derive a key without
    # importing one from a Wi-Fi driver. A workspace member because the known-answer tests that used
    # to run once per boot and print to a screen nobody reads now run on every `cargo test`.
    "libs/crypto",
    "libs/image",
    "libs/toolchains",
    # HTTP/TLS transport. A workspace member so `cargo test -p nyx-net` can exercise the URL and
    # HTTP parsing on the host — only the socket layer needs real hardware.
    "libs/net",
    # HTML -> plain text for the terminal's `get`/`links`/`open`. A workspace member specifically so
    # its tests run on the host: otherwise it would sit inside a binary's dependency graph, and
    # untestable string scanning is how a tag stripper quietly starts printing a page's JavaScript.
    "libs/htmltext",
    
    # Applications
    "apps/init",
    # ★ The window server, and since Meridian step 20 the ONLY one.
    #
    # `apps/compositor` — the panel, start-menu and system-tray desktop this project ran on for its
    # whole life — was retired here, together with `apps/wifi`, the standalone network picker it
    # launched from its tray. Both were kept deliberately until the last step of the 20-step build
    # order, on that order's own rule: *"deleting an application is the last step, never the first."*
    # The compositor was the desktop to fall back to while Meridian was built beside it, and the
    # picker was the only way to join a network from that desktop.
    #
    # What replaced them: the Entity's network drill-down (`libs/meridian`'s `network` module) for
    # the desktop, and the terminal's `wifi` command for everything else — including the case the
    # compositor used to cover, which is "the desktop did not come up and this machine still has to
    # get online".
    "apps/shell",
    # apps/terminal is now a std target_os=nyx binary (D3) — built standalone via Build-std.sh, so it
    # lives in `exclude` below, not here.
    "apps/settings",
    "apps/explorer",
    "apps/sysmon",
    "apps/glcube",
    "apps/imageviewer",
    # Headless, short-lived, and since step 20 it does double duty: init still spawns it with no
    # argument to rejoin the remembered network at boot, and `apps/shell` now spawns it WITH one for
    # every scan, join and radio toggle. The shell is the window server and those calls block in the
    # driver for seconds — see `nyx_api::WifiOp`.
    "apps/wifiagent",

]

# Force Cargo to ONLY build the kernel by default
default-members = ["nyx-kernel"]

# The std-port spike crate uses a different target + build-std=std; keep Cargo from pulling it
# into the workspace (it must be built standalone against x86_64-unknown-nyx.json).
exclude = ["tests/stdhello", "tests/stdchild", "tests/posix", "apps/qcstudio", "apps/stdgui", "apps/terminal", "apps/notepad", "vendor"]

resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"