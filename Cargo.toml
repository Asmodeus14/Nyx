[workspace]
members = [
    "nyx-kernel",
    
    # Tools
    "tools/compiler",
    "tools/runner",
    
    # Libraries
    "libs/api",
    "libs/gui",
    
    # Applications
    "apps/init",
    "apps/compositor",
    "apps/terminal",
    "apps/settings",
    "apps/explorer",
    "apps/network",
    "apps/sysmon",
    "apps/glcube",
    "apps/imageviewer",

]

# Force Cargo to ONLY build the kernel by default
default-members = ["nyx-kernel"]

# The std-port spike crate uses a different target + build-std=std; keep Cargo from pulling it
# into the workspace (it must be built standalone against x86_64-unknown-nyx.json).
exclude = ["tests/stdhello", "tests/stdchild", "apps/qcstudio", "vendor"]

resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"