[package]
name = "shell"
version = "0.1.0"
edition = "2021"

[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# The interface language: tokens, atlas, icons, shapes, geometry. Everything Meridian-specific that
# can be proved on the host lives there, not here — this binary has no `_start`-free path and so no
# tests of its own.
nyx-meridian = { path = "../../libs/meridian" }
# Meridian step 18 — the creature at the head of the Entity surface. `no_std`, no `alloc`, no float,
# and cross-checked cell for cell against the JavaScript generator in the design document, so a seed
# rendered there and the same seed rendered here produce the same creature.
nyx-entity = { path = "../../libs/entity" }
# Meridian step 19 — the lock's key derivation. Lifted out of `iwlwifi.rs` rather than written: the
# WPA2 handshake has been exercising this exact PBKDF2 on every Wi-Fi connect since the network
# stack came up. One implementation, two callers.
nyx-crypto = { path = "../../libs/crypto" }

linked_list_allocator = "0.10.5"

[profile.release]
panic = "abort"
