[package]
name = "browser"
version = "0.1.0"
edition = "2021"

# Nyx's web browser. A `target_os = "nyx"` std binary (same skeleton as apps/notepad), built
# standalone via Build-std.sh — NOT a workspace member, since it needs the std target + build-std.
[[bin]]
name = "browser"
path = "src/main.rs"

[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# HTTP/1.1 + TLS 1.3 — the same client `fetch` uses.
nyx-net = { path = "../../libs/net" }
# html5ever DOM + cssparser stylesheets + cascade + layout.
nyx-web = { path = "../../libs/web" }
# PNG/JPEG/BMP/TGA decoding for <img>. JPEG stays on (default features) — unlike the compositor,
# whose only images are PNG icons, a browser meets JPEGs constantly.
nyx-image = { path = "../../libs/image" }

[profile.release]
panic = "abort"
opt-level = 3
