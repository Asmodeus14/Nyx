[package]
name = "nyx-terminal"
version = "0.1.0"
edition = "2021"

# Workstream D (D3): the terminal is now a `target_os = "nyx"` std binary (built standalone via
# Build-std.sh, like apps/qcstudio and apps/stdgui — NOT a workspace member, since it uses the std
# target + build-std=std). std owns the heap/entry/panic, so linked_list_allocator is gone; nyx-gui
# and nyx-api link in unchanged. D4 adds a `nyx_toolchains` dep for the compiler-registry commands.
[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# D4: the pluggable compiler registry. Plain std + qclang_compiler (default-features=false → logos +
# thiserror), all proven to build for target_os=nyx. This is what makes `compile`/`toolchains` work.
nyx-toolchains = { path = "../../libs/toolchains" }
# HTTP/1.1 + TLS 1.3 (rustls + the RustCrypto provider). Backs `get`/`fetch`, and is now the ONLY
# consumer of the transport — the graphical browser and libs/web were deleted (see Build.sh).
nyx-net = { path = "../../libs/net" }
# HTML -> text for `get`/`links`/`open`. Zero dependencies by design: `libs/web` parses HTML
# properly, but linking it here would drag html5ever, cssparser and the layout engine into the
# terminal to do a tag strip.
nyx-htmltext = { path = "../../libs/htmltext" }
# Meridian step 11 — the terminal's interior. Two things only: the palette (`tokens::Theme`) and
# JetBrains Mono via `font::register_mono()`, which installs ONLY the mono face. The atlas and the
# icon table are the shell's business; this app draws through nyx-gui's CPU rasterizer as before.
nyx-meridian = { path = "../../libs/meridian" }

[[bin]]
name = "nyx-terminal"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = 3
