[package]
name = "nyx-settings"
version = "0.1.0"
edition = "2021"

[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# Meridian step 13 — the Settings interior. Reuses the SAME `.nav` pane as Files, plus the settings
# list (`panes::setting_row` / `segment` / `track`) and `font::register_text()`.
nyx-meridian = { path = "../../libs/meridian" }
# The Quantum pane. Only `creds` is used — pure `no_std` string parsing with no filesystem, shared
# with `libs/quantum-rt` so this screen and the terminal cannot disagree about what is configured.
# The device model comes through `nyx-api` (syscall 573) like every other hardware reading here.
nyx-quantum = { path = "../../libs/quantum" }
linked_list_allocator = "0.10.5"