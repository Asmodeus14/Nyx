[package]
name = "notepad"
version = "0.1.0"
edition = "2021"

# Meridian step 15 — Text. Was the toolbar-and-status-bar notepad; now one centred column of prose
# and nothing else, with the filename, word count and unsaved state on the CAPTION LINE outside the
# surface (which is what `WindowHeader::context` was added for).
#
# A `target_os = "nyx"` std binary so it can persist files with std::fs — built standalone via
# Build-std.sh, NOT a workspace member. nyx-gui/nyx-api link in unchanged.
[[bin]]
name = "notepad"
path = "src/main.rs"

[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# The interior: `prose` (the measure, the block stack, the wrap and the caret) plus the tokens and
# `text`. All the geometry is host-tested there, because this binary's own tests cannot run on the
# host and this machine has no QEMU.
nyx-meridian = { path = "../../libs/meridian" }

[profile.release]
panic = "abort"
