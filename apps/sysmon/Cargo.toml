[package]
name = "nyx-sysmon"
version = "0.1.0"
edition = "2024"

[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# Meridian step 12 — the System Monitor interior. The metric-grid geometry (`panes::metric_cell` /
# `spark_bar`), the CPU type-and-icon path (`text`), and Inter via `font::register_text()` plus
