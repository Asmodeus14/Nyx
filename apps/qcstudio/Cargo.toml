[package]
name = "qcstudio"
version = "0.1.0"
edition = "2021"

# Meridian step 14 — the QCLang window. Was Workstream C's headless round-trip (.ql -> .qasm on
# device, byte-compared against host qclang); it still does all of that, and now shows the result
# instead of println!-ing it into a boot log this laptop has no serial console to read.
#
# A `target_os = "nyx"` std binary, built standalone via Build-std.sh like apps/terminal and
# apps/notepad — NOT a workspace member, since it uses the std target + build-std=std. std owns the
# heap, the entry and panics, so there is no linked_list_allocator here.
[[bin]]
name = "qcstudio"
path = "src/main.rs"

[dependencies]
nyx-api = { path = "../../libs/api" }
nyx-gui = { path = "../../libs/gui" }
# The interior: tokens, the code pane's type, and `circuit` — the wire rows, gate cells, connector
# and measurement table, all host-tested because this binary's own tests cannot run on the host.
nyx-meridian = { path = "../../libs/meridian" }
# The portable compiler core (logos + thiserror; no host CLI, no `sim` feature, so no rand and no
# num-complex). Supplies the compile, `program::flatten` for the circuit, `statevector::evaluate`
# for the exact distribution, and `highlight` for the code pane's three tones.
qclang_compiler = { path = "../../tools/compiler", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
