[package]
name = "nyx-web"
version = "0.1.0"
edition = "2021"
description = "HTML/CSS engine for Nyx — html5ever DOM, cssparser stylesheets, selector matching and cascade"

[lib]
name = "nyx_web"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("nyx"))'] }

[dependencies]
# Servo's real HTML parser. Not a shortcut: real pages are full of unclosed tags, implied <tbody>,
# misnested inlines and stray text before <html>, and the tree-construction rules that repair all of
# that are the spec's, not something worth re-deriving. Proven to build for target_os=nyx.
html5ever = "0.27"
markup5ever_rcdom = "0.3"
# Servo's CSS tokenizer — handles strings, escapes, comments, at-rules and error recovery.
cssparser = "0.34"
# JavaScript. Verified to build for x86_64-unknown-nyx in the Phase 0 spike.
#
# `default-features = false` on purpose: boa's defaults include `intl`, which drags in ICU and its
# locale data. The browser binary is already 3.4 MB and Nyx has no OOM killer, so paying tens of MB
# for Intl.* before a single page script runs is the wrong trade. Enable it the day something
# actually needs locale-aware formatting.
boa_engine = { version = "0.19", default-features = false }
