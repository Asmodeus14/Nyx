[package]
name = "nyx-image"
version = "0.1.0"
edition = "2021"

# Shared no_std image decoding (BMP/TGA/PNG/JPEG -> B8G8R8A8). Used by the image viewer and by the
# compositor, which decodes the desktop's icon PNGs with it.
[features]
# JPEG costs ~150 KiB of decoder in every binary that links it. The image viewer wants it; the
# compositor, whose only images are PNG icons, takes this crate with default-features = false.
default = ["jpeg"]
jpeg = ["dep:zune-jpeg", "dep:zune-core"]

[dependencies]
# miniz_oxide: zlib/DEFLATE inflate for PNG IDAT (hand-written PNG parser on top).
#              `with-alloc` gives inflate::decompress_to_vec_zlib without std.
# zune-jpeg:   baseline/progressive JPEG; default-features=false drops the std feature + the
#              runtime-SIMD path (needs is_x86_feature_detected!), leaving the portable scalar IDCT.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
zune-jpeg = { version = "0.4", default-features = false, optional = true }
zune-core = { version = "0.4", default-features = false, optional = true }
